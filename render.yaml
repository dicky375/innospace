services:
  - type: web
    name: innospace-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: innospace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: innospace-redis
          type: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://innospace-connect.vercel.app/
      - key: INTERNAL_SERVICE_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@innospace.com
      - key: ADMIN_PASSWORD
        sync: false

  - type: postgres
    name: innospace-db
    plan: starter
    databaseName: innospace

  - type: redis
    name: innospace-redis
    plan: starter
    maxmemoryPolicy: noeviction